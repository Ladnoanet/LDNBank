<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Банк — демо</title>
    <style>
        :root {
            color-scheme: light dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background: #0b0f14;
            color: #e8eef5;
        }

        .container {
            max-width: 560px;
            margin: 0 auto;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: 16px;
        }

        header {
            padding: 12px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        h1 {
            font-size: 18px;
            margin: 0;
        }

        .card {
            background: #121821;
            border: 1px solid #1f2a37;
            border-radius: 14px;
            padding: 16px;
            margin-top: 12px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #9fb0c3;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid #2a3a4d;
            background: #0f141b;
            color: #e8eef5;
            outline: none;
        }

        input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
        }

        button {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: none;
            background: #3b82f6;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        button.secondary {
            background: #223044;
            color: #d6e2ef;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .muted {
            color: #9fb0c3;
            font-size: 13px;
        }

        .balance {
            font-size: 28px;
            font-weight: 700;
            margin: 2px 0 0;
        }

        .id {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 14px;
            color: #9fb0c3;
        }

        .space {
            height: 12px;
        }

        @media (min-width: 480px) {
            .row.two {
                grid-template-columns: 1fr 1fr;
            }
        }

        .error {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 8px;
        }

        .success {
            color: #22c55e;
            font-size: 13px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Банк</h1>
            <button id="logoutBtn" class="secondary" style="display:none;width:auto;padding:8px 12px;">Выйти</button>
        </header>

        <main id="authScreen" class="card" style="display:none;">
            <h2 style="margin:0 0 12px;font-size:18px;">Регистрация</h2>
            <div class="row">
                <div>
                    <label for="nameInput">Имя</label>
                    <input id="nameInput" type="text" minlength="1" maxlength="32" placeholder="Например, Анна" autocomplete="name">
                </div>
                <div class="space"></div>
                <button id="registerBtn">Зарегистрироваться</button>
                <div id="authMsg" class="error" style="display:none;"></div>
            </div>
            <p class="muted" style="margin-top:12px;">После регистрации вам будет выдан баланс 1000. Ваш ID — 4 цифры.</p>
        </main>

        <section id="dashboard" style="display:none;">
            <div class="card">
                <div class="muted">Ваш баланс</div>
                <div id="balance" class="balance">—</div>
                <div class="id">ID: <span id="myId">----</span></div>
            </div>

            <div class="card">
                <h2 style="margin:0 0 12px;font-size:18px;">Перевод</h2>
                <div class="row">
                    <div>
                        <label for="toIdInput">ID получателя (4 цифры)</label>
                        <input id="toIdInput" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="Напр. 0456">
                    </div>
                    <div>
                        <label for="amountInput">Сумма</label>
                        <input id="amountInput" inputmode="decimal" placeholder="Напр. 12.50">
                    </div>
                    <div class="space"></div>
                    <button id="sendBtn">Отправить</button>
                    <div id="txMsg" class="error" style="display:none;"></div>
                    <div id="txOk" class="success" style="display:none;"></div>
                </div>
                <p class="muted" style="margin-top:12px;">Переводы мгновенные. Комиссия 0.</p>
            </div>
            <br>
        </section>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
        import { 
            getDatabase, ref, set, get, child, runTransaction, onValue
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";
        import {
            getAuth, signInAnonymously, onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


        const firebaseConfig = {
            apiKey: "AIzaSyDIzUhQCwOEUaLX59T7dx_Op8XLjSzB9fY",
            authDomain: "top-social-a5095.firebaseapp.com",
            databaseURL: "https://top-social-a5095-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "top-social-a5095",
            storageBucket: "top-social-a5095.firebasestorage.app",
            messagingSenderId: "759098409457",
            appId: "1:759098409457:web:a36f924e7c89a932df4450",
            measurementId: "G-211Y7FLVV0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        let authReadyResolve;
        const authReady = new Promise((resolve) => { authReadyResolve = resolve; });
        onAuthStateChanged(auth, (user) => {
            if (user) {
                authReadyResolve();
            }
        });
        // Ensure we attempt sign-in
        signInAnonymously(auth).catch(() => {});

        const $ = (id) => document.getElementById(id);
        const authScreen = $("authScreen");
        const dashboard = $("dashboard");
        const nameInput = $("nameInput");
        const registerBtn = $("registerBtn");
        const authMsg = $("authMsg");
        const logoutBtn = $("logoutBtn");
        const balanceEl = $("balance");
        const myIdEl = $("myId");
        const toIdInput = $("toIdInput");
        const amountInput = $("amountInput");
        const sendBtn = $("sendBtn");
        const txMsg = $("txMsg");
        const txOk = $("txOk");

        const INITIAL_BALANCE_CENTS = 1000 * 100;

        function formatCents(cents) {
            const value = (cents ?? 0) / 100;
            return value.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function parseAmountToCents(input) {
            if (!input) return NaN;
            const normalized = input.replace(",", ".").replace(/\s+/g, "");
            const num = Number(normalized);
            if (!isFinite(num) || num <= 0) return NaN;
            return Math.round(num * 100);
        }

        function saveSession(userId) {
            localStorage.setItem("bank_user_id", userId);
        }

        function getSession() {
            return localStorage.getItem("bank_user_id");
        }

        function clearSession() {
            localStorage.removeItem("bank_user_id");
        }

        function showAuth() {
            authScreen.style.display = "block";
            dashboard.style.display = "none";
            logoutBtn.style.display = "none";
        }

        function showDashboard() {
            authScreen.style.display = "none";
            dashboard.style.display = "block";
            logoutBtn.style.display = "inline-flex";
        }

        async function userExistsById(userId) {
            const snapshot = await get(ref(db, `users/${userId}`));
            return snapshot.exists();
        }

        function generateCandidateId() {
            const n = Math.floor(Math.random() * 10000);
            return n.toString().padStart(4, "0");
        }

        async function generateUniqueId(maxAttempts = 20) {
            for (let i = 0; i < maxAttempts; i++) {
                const candidate = generateCandidateId();
                if (!(await userExistsById(candidate))) return candidate;
            }
            throw new Error("Не удалось сгенерировать уникальный ID. Повторите попытку.");
        }

        async function registerUser(displayName) {
            const userId = await generateUniqueId();
            const userRef = ref(db, `users/${userId}`);
            const now = Date.now();
            await set(userRef, {
                id: userId,
                name: displayName,
                balanceCents: INITIAL_BALANCE_CENTS,
                createdAt: now,
                updatedAt: now
            });
            saveSession(userId);
            return userId;
        }

        async function loadAndWatchMe(userId) {
            const meRef = ref(db, `users/${userId}`);
            onValue(meRef, (snap) => {
                const me = snap.val();
                if (!me) {
                    // если удалён — разлогинимся
                    clearSession();
                    showAuth();
                    return;
                }
                balanceEl.textContent = formatCents(me.balanceCents);
                myIdEl.textContent = me.id;
            });
        }

        async function transferCents(fromId, toId, amountCents) {
            if (fromId === toId) throw new Error("Нельзя переводить самому себе");

            // Проверка существования получателя и корректности баланса
            const toSnap = await get(ref(db, `users/${toId}/balanceCents`));
            if (!toSnap.exists()) throw new Error("Получатель не найден");
            const toVal0 = toSnap.val();
            if (typeof toVal0 !== "number" && !(typeof toVal0 === "string" && /^\d+$/.test(toVal0))) {
                throw new Error("Баланс получателя имеет неверный формат");
            }

            // 1) Списание у отправителя
            const fromBalanceRef = ref(db, `users/${fromId}/balanceCents`);
            const debit = await runTransaction(fromBalanceRef, (current) => {
                if (current === null) return; // abort
                let cur = current;
                if (typeof cur === "string" && /^\d+$/.test(cur)) cur = Number(cur);
                if (typeof cur !== "number") return; // abort
                if (cur < amountCents) return; // abort: нет средств
                return cur - amountCents;
            });
            if (!debit.committed) throw new Error("Недостаточно средств");

            // 2) Зачисление получателю с компенсацией при ошибке
            const toBalanceRef = ref(db, `users/${toId}/balanceCents`);
            let credit;
            try {
                credit = await runTransaction(toBalanceRef, (current) => {
                    if (current === null) return; // abort if no recipient (гонка)
                    let cur = current;
                    if (typeof cur === "string" && /^\d+$/.test(cur)) cur = Number(cur);
                    if (typeof cur !== "number") return; // abort: неверный формат
                    return cur + amountCents;
                });
            } catch (err) {
                // Возврат средств при ошибке правил/доступа
                await runTransaction(fromBalanceRef, (current) => {
                    let cur = current;
                    if (typeof cur === "string" && /^\d+$/.test(cur)) cur = Number(cur);
                    if (typeof cur !== "number") return current;
                    return cur + amountCents;
                });
                throw err;
            }

            if (!credit.committed) {
                // Диагностика причины отмены
                const afterTo = await get(toBalanceRef);
                if (!afterTo.exists()) {
                    // получатель исчез между шагами
                    await runTransaction(fromBalanceRef, (current) => {
                        let cur = current;
                        if (typeof cur === "string" && /^\d+$/.test(cur)) cur = Number(cur);
                        if (typeof cur !== "number") return current;
                        return cur + amountCents;
                    });
                    throw new Error("Получатель не найден");
                }
                const v = afterTo.val();
                const okNumber = (typeof v === "number") || (typeof v === "string" && /^\d+$/.test(v));
                if (!okNumber) {
                    await runTransaction(fromBalanceRef, (current) => {
                        let cur = current;
                        if (typeof cur === "string" && /^\d+$/.test(cur)) cur = Number(cur);
                        if (typeof cur !== "number") return current;
                        return cur + amountCents;
                    });
                    throw new Error("Баланс получателя имеет неверный формат");
                }
                // Иная причина (например, конкурирующая транзакция) — для демо сделаем без транзакций
                // 1) Вернём списание, чтобы не зависли средства
                await runTransaction(fromBalanceRef, (current) => {
                    let cur = current;
                    if (typeof cur === "string" && /^\d+$/.test(cur)) cur = Number(cur);
                    if (typeof cur !== "number") return current;
                    return cur + amountCents;
                });

                // 2) Попробуем простой read→write без транзакций (демонстрационный режим)
                const [fromSnap2, toSnap2] = await Promise.all([
                    get(fromBalanceRef),
                    get(toBalanceRef)
                ]);
                let fromBal2 = fromSnap2.exists() ? fromSnap2.val() : null;
                let toBal2 = toSnap2.exists() ? toSnap2.val() : null;
                if (typeof fromBal2 === "string" && /^\d+$/.test(fromBal2)) fromBal2 = Number(fromBal2);
                if (typeof toBal2 === "string" && /^\d+$/.test(toBal2)) toBal2 = Number(toBal2);
                if (typeof fromBal2 !== "number" || typeof toBal2 !== "number") {
                    throw new Error("Неверный формат баланса у участников");
                }
                if (fromBal2 < amountCents) throw new Error("Недостаточно средств");
                await Promise.all([
                    set(fromBalanceRef, fromBal2 - amountCents),
                    set(toBalanceRef, toBal2 + amountCents)
                ]);
                return; // успех без транзакций
            }

            // Отметим обновление времени (не критично к целостности)
            const now = Date.now();
            await set(ref(db, `users/${fromId}/updatedAt`), now);
            await set(ref(db, `users/${toId}/updatedAt`), now);
        }

        // UI handlers
        registerBtn.addEventListener("click", async () => {
            authMsg.style.display = "none";
            const name = (nameInput.value || "").trim();
            if (!name) {
                authMsg.textContent = "Введите имя";
                authMsg.style.display = "block";
                return;
            }
            registerBtn.disabled = true;
            try {
                await authReady;
                const userId = await registerUser(name);
                showDashboard();
                await loadAndWatchMe(userId);
            } catch (e) {
                const msg = (e && (e.code || e.message)) ? `${e.code || ''} ${e.message || ''}`.trim() : String(e);
                authMsg.textContent = msg || "Ошибка регистрации";
                authMsg.style.display = "block";
            } finally {
                registerBtn.disabled = false;
            }
        });

        logoutBtn.addEventListener("click", () => {
            clearSession();
            showAuth();
        });

        sendBtn.addEventListener("click", async () => {
            txMsg.style.display = "none";
            txOk.style.display = "none";
            const toId = (toIdInput.value || "").trim().padStart(4, "0");
            const amountCents = parseAmountToCents(amountInput.value || "");
            if (!/^\d{4}$/.test(toId)) {
                txMsg.textContent = "ID должен состоять из 4 цифр";
                txMsg.style.display = "block";
                return;
            }
            if (!Number.isFinite(amountCents)) {
                txMsg.textContent = "Введите корректную сумму";
                txMsg.style.display = "block";
                return;
            }
            const me = getSession();
            if (!me) {
                txMsg.textContent = "Сессия истекла. Перезайдите.";
                txMsg.style.display = "block";
                return;
            }
            sendBtn.disabled = true;
            try {
                await authReady;
                await transferCents(String(me), toId, amountCents);
                txOk.textContent = `Отправлено ${formatCents(amountCents)} → ${toId}`;
                txOk.style.display = "block";
                toIdInput.value = "";
                amountInput.value = "";
            } catch (e) {
                const msg = (e && (e.code || e.message)) ? `${e.code || ''} ${e.message || ''}`.trim() : String(e);
                txMsg.textContent = msg || "Операция не выполнена";
                txMsg.style.display = "block";
            } finally {
                sendBtn.disabled = false;
            }
        });

        function kredit() {
            
        }

        // Bootstrap
        (async function init() {
            await authReady;
            const me = getSession();
            if (me) {
                await loadAndWatchMe(me);
                showDashboard();
            } else {
                showAuth();
            }
        })();
    </script>
</body>
</html>
